name: React CI/CD

on:
  push:
    branches: ["firebase-deploy"]
  pull_request:
    branches: ["firebase-deploy"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Create .env file
        run: |
          echo "REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}" >> .env
          echo "REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}" >> .env
          echo "REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }}" >> .env
          echo "REACT_APP_FIREBASE_MEASUREMENT_ID=${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "REACT_APP_FIREBASE_VAPID_KEY=${{ secrets.REACT_APP_FIREBASE_VAPID_KEY }}" >> .env
          echo "REACT_APP_MACHINE_ID=${{ secrets.REACT_APP_MACHINE_ID }}" >> .env
          echo "REACT_APP_CUSTOM_DOMAIN=${{ secrets.REACT_APP_CUSTOM_DOMAIN }}" >> .env
          echo "REACT_APP_NOTIFICATION_ICON=${{ secrets.REACT_APP_NOTIFICATION_ICON }}" >> .env
          echo "REACT_APP_NOTIFICATION_BADGE=${{ secrets.REACT_APP_NOTIFICATION_BADGE }}" >> .env
          echo "REACT_APP_DEBUG_FCM=${{ secrets.REACT_APP_DEBUG_FCM }}" >> .env
          echo "REACT_APP_ENABLE_NOTIFICATION_TESTING=${{ secrets.REACT_APP_ENABLE_NOTIFICATION_TESTING }}" >> .env

      - name: Verify .env file
        run: |
          echo "Checking .env file contents..."
          cat .env | grep -v "KEY\|TOKEN" || true
          echo "Environment variables loaded"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: |
          echo "Building React app..."
          GENERATE_SOURCEMAP=false npm run build
          echo "Build completed successfully"

      - name: List build directory
        run: |
          echo "Build directory contents:"
          ls -la build/
          echo "Build size:"
          du -sh build/

      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/firebase-deploy'

    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Verify build artifact
        run: |
          echo "Downloaded build contents:"
          ls -la build/
          echo "Checking for index.html:"
          ls -la build/index.html || echo "index.html not found!"

      - name: Setup Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Firebase project
        run: |
          echo "Verifying Firebase configuration..."
          firebase --version
          
      - name: Deploy to Firebase
        run: |
          echo "Deploying to Firebase Hosting..."
          firebase deploy --only hosting --non-interactive --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}